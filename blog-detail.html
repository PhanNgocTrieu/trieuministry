<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog detail page">
    <title>Blog Detail - Personal Profile</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">

    <!-- TailwindCSS CDN - Configured to not conflict with Bootstrap -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        important: false,
        corePlugins: { preflight: false }
      }
    </script>
    <style>
      @media (min-width: 992px) {
        .navbar-expand-lg .navbar-collapse { display: flex !important; }
        .navbar-expand-lg .navbar-nav { display: flex !important; flex-direction: row !important; }
      }
    </style>
</head>
<body>
    <div class="reading-progress" id="readingProgress"></div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-heart text-primary me-2"></i>
                My Profile
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="docs.html">Docs</a></li>
                    <li class="nav-item"><a class="nav-link" href="prayers.html">Prayers</a></li>
                    <li class="nav-item"><a class="nav-link" href="donate.html">Donate</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section class="hero-blog-detail text-white">
            <div class="container py-5">
                <p class="mb-2" id="blogCategory"></p>
                <h1 class="display-5 fw-bold mb-3" id="blogTitle">Tiêu đề bài viết</h1>
                <div class="d-flex flex-wrap align-items-center gap-3 text-white-50">
                    <span><i class="fas fa-user me-2"></i><span id="blogAuthor">Tác giả</span></span>
                    <span><i class="fas fa-calendar me-2"></i><span id="blogDate">Ngày</span></span>
                    <span><i class="fas fa-clock me-2"></i><span id="blogReadingTime">3 phút đọc</span></span>
                </div>
            </div>
        </section>

        <section class="section-padding">
            <div class="container">
                <div class="row">
                    <div class="col-lg-8">
                        <article class="card shadow-sm border-0 mb-4">
                            <img src="" alt="Blog image" class="card-img-top blog-detail-image" id="blogImage" onerror="this.src='https://via.placeholder.com/900x400?text=Blog+Image'">
                            <div class="card-body p-4" id="blogContent">
                                <!-- Content will be injected here -->
                            </div>
                        </article>

                        <div class="d-flex flex-wrap gap-2 mb-4" id="blogTags"></div>

                        <div class="d-flex flex-wrap gap-2 mb-4">
                            <button class="btn btn-outline-primary" id="shareBtn"><i class="fas fa-share-alt me-2"></i>Chia sẻ</button>
                            <button class="btn btn-outline-secondary" id="printBtn"><i class="fas fa-print me-2"></i>In</button>
                        </div>

                        <div class="d-flex justify-content-between mb-5" id="prevNextNav"></div>
                    </div>

                    <div class="col-lg-4">
                        <div class="card shadow-sm border-0 mb-4">
                            <div class="card-body">
                                <h5 class="fw-semibold mb-3">Bài liên quan</h5>
                                <div id="relatedPosts" class="d-flex flex-column gap-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p>&copy; 2024 Personal Profile. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <a href="#" class="text-white me-3" aria-label="GitHub"><i class="fab fa-github"></i></a>
                    <a href="#" class="text-white me-3" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                    <a href="#" class="text-white" aria-label="Email"><i class="fas fa-envelope"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <button class="back-to-top" aria-label="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/blog-detail.js"></script>
</body>
</html>
