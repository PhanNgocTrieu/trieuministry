<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blogs - Bài viết, journel, chia sẻ cá nhân">
    <title>Blogs - Personal Profile</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">

    <!-- TailwindCSS CDN - Configured to not conflict with Bootstrap -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        important: false,
        corePlugins: {
          preflight: false,
        }
      }
    </script>
    <style>
      @media (min-width: 992px) {
        .navbar-expand-lg .navbar-collapse { display: flex !important; }
        .navbar-expand-lg .navbar-nav { display: flex !important; flex-direction: row !important; }
      }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-heart text-primary me-2"></i>
                My Profile
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="docs.html">Docs</a></li>
                    <li class="nav-item"><a class="nav-link" href="prayers.html">Prayers</a></li>
                    <li class="nav-item"><a class="nav-link" href="donate.html">Donate</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <!-- Hero -->
        <section class="hero-section bg-gradient-primary text-white py-5">
            <div class="container py-4">
                <div class="row align-items-center">
                    <div class="col-lg-8">
                        <h1 class="display-5 fw-bold mb-3">Blogs & Journals</h1>
                        <p class="lead mb-0">Đọc các bài viết, suy ngẫm, và chia sẻ hành trình.</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Filters -->
        <section class="section-padding bg-light">
            <div class="container">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="row g-3 align-items-center">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Tìm kiếm</label>
                                <input type="text" class="form-control" id="searchInput" placeholder="Từ khóa, tiêu đề, nội dung...">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Danh mục</label>
                                <select class="form-select" id="categoryFilter">
                                    <option value="">Tất cả</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Tag</label>
                                <input type="text" class="form-control" id="tagFilter" placeholder="Nhập tag, ví dụ: faith">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Blog List -->
        <section class="section-padding">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="mb-0">Bài viết</h2>
                    <span class="text-muted" id="countLabel">0 bài</span>
                </div>
                <div class="row g-4" id="blogsContainer"></div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p>&copy; 2024 Personal Profile. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <a href="#" class="text-white me-3" aria-label="GitHub"><i class="fab fa-github"></i></a>
                    <a href="#" class="text-white me-3" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                    <a href="#" class="text-white" aria-label="Email"><i class="fas fa-envelope"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Back to Top Button -->
    <button class="back-to-top" aria-label="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/blogs.js"></script>
</body>
</html>
