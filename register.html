<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - TrieuMinistry</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body class="bg-light fade-in">
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="max-width: 900px; width: 100%;">
            <div class="row g-0">
                <!-- Left Side: Image/Branding -->
                <div
                    class="col-lg-6 bg-primary text-white d-flex align-items-center justify-content-center p-5 position-relative overflow-hidden">
                    <div class="overlay opacity-50 position-absolute w-100 h-100 bg-dark"
                        style="top:0;left:0; z-index:1;"></div>
                    <div class="position-relative z-2 text-center">
                        <i class="fas fa-church fa-4x mb-4"></i>
                        <h2 class="fw-bold">TrieuMinistry</h2>
                        <p class="lead mb-0">Tham gia cộng đồng Đức Tin</p>
                    </div>
                    <!-- Decorative Circles -->
                    <div class="position-absolute rounded-circle bg-white opacity-10"
                        style="width: 300px; height: 300px; top: -50px; left: -50px;"></div>
                    <div class="position-absolute rounded-circle bg-white opacity-10"
                        style="width: 200px; height: 200px; bottom: -50px; right: -50px;"></div>
                </div>

                <!-- Right Side: Registration Form -->
                <div class="col-lg-6 bg-white p-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold mb-2">Tạo tài khoản</h3>
                        <p class="text-secondary">Điền thông tin để bắt đầu</p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="fas fa-user text-secondary"></i></span>
                                <input type="text" class="form-control bg-light border-start-0 ps-0" id="fullName"
                                    placeholder="Họ và tên" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="fas fa-envelope text-secondary"></i></span>
                                <input type="email" class="form-control bg-light border-start-0 ps-0" id="email"
                                    placeholder="Email của bạn" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="fas fa-lock text-secondary"></i></span>
                                <input type="password" class="form-control bg-light border-start-0 ps-0" id="password"
                                    placeholder="Mật khẩu (tối thiểu 6 ký tự)" required minlength="6">
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="fas fa-lock text-secondary"></i></span>
                                <input type="password" class="form-control bg-light border-start-0 ps-0"
                                    id="confirmPassword" placeholder="Nhập lại mật khẩu" required minlength="6">
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold hover-scale">Đăng
                                ký</button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="small text-secondary">Đã có tài khoản? <a href="login.html"
                                class="text-primary fw-bold text-decoration-none">Đăng nhập ngay</a></p>
                        <p class="small"><a href="index.html" class="text-secondary text-decoration-none"><i
                                    class="fas fa-arrow-left me-1"></i> Quay lại trang chủ</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <script type="module">
        import { registerWithEmail } from './assets/js/auth.js';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Mật khẩu nhập lại không khớp!');
                return;
            }

            try {
                await registerWithEmail(email, password, fullName);
                alert('Đăng ký thành công! Bạn sẽ được chuyển hướng về trang chủ.');
                window.location.href = 'index.html';
            } catch (error) {
                let msg = error.message;
                if (error.code === 'auth/email-already-in-use') {
                    msg = 'Email này đã được sử dụng.';
                } else if (error.code === 'auth/weak-password') {
                    msg = 'Mật khẩu quá yếu.';
                }
                alert('Lỗi đăng ký: ' + msg);
            }
        });
    </script>
</body>

</html>
