<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TrieuMinistry</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body class="bg-light fade-in">
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="max-width: 900px; width: 100%;">
            <div class="row g-0">
                <!-- Left Side: Image/Branding -->
                <div
                    class="col-lg-6 bg-primary text-white d-flex align-items-center justify-content-center p-5 position-relative overflow-hidden">
                    <div class="overlay opacity-50 position-absolute w-100 h-100 bg-dark"
                        style="top:0;left:0; z-index:1;"></div>
                    <div class="position-relative z-2 text-center">
                        <i class="fas fa-church fa-4x mb-4"></i>
                        <h2 class="fw-bold">TrieuMinistry</h2>
                        <p class="lead mb-0">Kết nối Đức Tin & Lan tỏa Yêu Thương</p>
                    </div>
                    <!-- Decorative Circles -->
                    <div class="position-absolute rounded-circle bg-white opacity-10"
                        style="width: 300px; height: 300px; top: -50px; left: -50px;"></div>
                    <div class="position-absolute rounded-circle bg-white opacity-10"
                        style="width: 200px; height: 200px; bottom: -50px; right: -50px;"></div>
                </div>

                <!-- Right Side: Login Form -->
                <div class="col-lg-6 bg-white p-5">
                    <div class="text-center mb-5">
                        <h3 class="fw-bold mb-2">Xin chào!</h3>
                        <p class="text-secondary">Đăng nhập để kết nối cùng cộng đồng</p>
                    </div>

                    <div class="d-grid gap-3 mb-4">
                        <button id="googleLoginBtn"
                            class="btn btn-outline-dark btn-lg rounded-pill d-flex align-items-center justify-content-center gap-2 hover-scale">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"
                                width="20">
                            <span>Tiếp tục với Google</span>
                        </button>
                    </div>

                    <div class="position-relative mb-4 text-center">
                        <hr class="text-secondary opacity-25">
                        <span
                            class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-secondary small">Hoặc</span>
                    </div>

                    <form id="emailLoginForm">
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="fas fa-envelope text-secondary"></i></span>
                                <input type="email" class="form-control bg-light border-start-0 ps-0" id="email"
                                    placeholder="Email của bạn" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="fas fa-lock text-secondary"></i></span>
                                <input type="password" class="form-control bg-light border-start-0 ps-0" id="password"
                                    placeholder="Mật khẩu" required>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold hover-scale">Đăng
                                nhập</button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="small text-secondary">Chưa có tài khoản? <a href="register.html"
                                class="text-primary fw-bold text-decoration-none">Đăng ký ngay</a></p>
                        <p class="small"><a href="index.html" class="text-secondary text-decoration-none"><i
                                    class="fas fa-arrow-left me-1"></i> Quay lại trang chủ</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <script type="module">
        import { loginWithGoogle, loginWithEmail } from './assets/js/auth.js';

        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                await loginWithGoogle();
                window.location.href = 'index.html';
            } catch (error) {
                alert(error.message);
            }
        });

        document.getElementById('emailLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await loginWithEmail(email, password);
                window.location.href = 'index.html';
            } catch (error) {
                alert(error.message);
            }
        });
    </script>
</body>

</html>
