<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Docs - Tài liệu PDF, tải về và xem trước">
    <title>Docs - Personal Profile</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">

    <!-- TailwindCSS CDN - Configured to not conflict with Bootstrap -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        important: false,
        corePlugins: { preflight: false }
      }
    </script>
    <style>
      @media (min-width: 992px) {
        .navbar-expand-lg .navbar-collapse { display: flex !important; }
        .navbar-expand-lg .navbar-nav { display: flex !important; flex-direction: row !important; }
      }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-heart text-primary me-2"></i>
                My Profile
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="docs.html">Docs</a></li>
                    <li class="nav-item"><a class="nav-link" href="prayers.html">Prayers</a></li>
                    <li class="nav-item"><a class="nav-link" href="donate.html">Donate</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <!-- Hero -->
        <section class="hero-section bg-gradient-primary text-white py-5">
            <div class="container py-4">
                <div class="row align-items-center">
                    <div class="col-lg-8">
                        <h1 class="display-5 fw-bold mb-3">Tài liệu PDF</h1>
                        <p class="lead mb-0">Xem trước, tải xuống và đọc các tài liệu hữu ích.</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Filters -->
        <section class="section-padding bg-light">
            <div class="container">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="row g-3 align-items-center">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Tìm kiếm</label>
                                <input type="text" class="form-control" id="searchDocInput" placeholder="Tên tài liệu, mô tả...">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Danh mục</label>
                                <select class="form-select" id="categoryDocFilter">
                                    <option value="">Tất cả</option>
                                </select>
                            </div>
                            <div class="col-md-4 d-flex align-items-end justify-content-end gap-2">
                                <button class="btn btn-outline-secondary" id="resetFilters">Reset</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Docs List -->
        <section class="section-padding">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="mb-0">Danh sách tài liệu</h2>
                    <span class="text-muted" id="docsCountLabel">0 tài liệu</span>
                </div>
                <div class="row g-4" id="docsContainer"></div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p>&copy; 2024 Personal Profile. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <a href="#" class="text-white me-3" aria-label="GitHub"><i class="fab fa-github"></i></a>
                    <a href="#" class="text-white me-3" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                    <a href="#" class="text-white" aria-label="Email"><i class="fas fa-envelope"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <button class="back-to-top" aria-label="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Preview Modal -->
    <div class="modal fade" id="pdfPreviewModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="pdfPreviewTitle">Xem trước tài liệu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-0">
            <div class="ratio ratio-16x9">
              <iframe id="pdfPreviewFrame" src="" title="PDF Preview" allowfullscreen></iframe>
            </div>
          </div>
          <div class="modal-footer">
            <a id="downloadFromModal" class="btn btn-primary" href="#" download>Download</a>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/docs.js"></script>
</body>
</html>
